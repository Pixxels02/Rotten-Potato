<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten Potato - Watchlist Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/form.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Rotten Potato</h1>
        <p class="site-slogan">Eure Watchlist für Filme und Serien</p>
    </header>

    <main class="main-content">
        <section class="add-section">
            <h2>Neuen Titel hinzufügen</h2>
            <form id="movie-form" class="movie-form">
                <div class="form-field">
                    <label for="title-input">Titel</label>
                    <input type="text" id="title-input" maxlength="100">
                </div>

                <div class="form-field">
                    <label for="type-select">Typ</label>
                    <select id="type-select">
                        <option value="Film">Film</option>
                        <option value="Serie">Serie</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="genre-input">Genre</label>
                    <input type="text" id="genre-input" maxlength="50">
                </div>

                <div class="form-field hidden" id="episodes-field">
                    <label for="episodes-input">Anzahl Folgen</label>
                    <input type="number" id="episodes-input" min="1" value="1">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button" class="form-button">Hinzufügen</button>
                    <p id="form-message" class="form-message"></p>
                </div>
            </form>
        </section>

        <section class="random-section">
            <h2>Was schauen wir heute?</h2>
            <button type="button" id="random-button" class="random-button">Zufälligen Titel wählen</button>
            <p id="random-result" class="random-result">Klicke auf den Button, um überrascht zu werden.</p>
        </section>

        <section class="watchlist-section">
            <h2>Eure Watchlist</h2>
            <ul id="movie-list" class="movie-grid">
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Rotten Potato – WI_25B_Gruppe_1</p>
    </footer>
</body>
</html>
