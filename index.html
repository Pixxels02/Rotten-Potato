<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten Potato - Watchlist Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/form.js" defer></script>
    <script src="js/script.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/stats.js" defer></script>
    <script src="js/filter.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Rotten Potato</h1>
        <p class="site-slogan">Eure Watchlist für Filme und Serien</p>
    </header>

    <main class="main-content">
        <section class="add-section">
            <h2>Neuen Titel hinzufügen</h2>
            <form id="movie-form" class="movie-form" novalidate>
                <div class="form-field">
                    <label for="title-input">Titel</label>
                    <input type="text" id="title-input" maxlength="100" required>
                    <p id="title-error" class="error-message"></p>
                </div>

                <div class="form-field">
                    <label for="type-select">Typ</label>
                    <select id="type-select">
                        <option value="Film">Film</option>
                        <option value="Serie">Serie</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="genre-input">Genre</label>
                    <input type="text" id="genre-input" maxlength="50" required>
                    <p id="genre-error" class="error-message"></p>
                </div>

                <div class="form-field hidden" id="episodes-field">
                    <label for="episodes-input">Anzahl Folgen</label>
                    <input type="number" id="episodes-input" min="1" value="1">
                    <p id="episodes-error" class="error-message"></p>
                </div>

                <div class="form-actions">
                    <button type="submit" id="submit-button" class="form-button">Hinzufügen</button>
                    <p id="form-message" class="form-message"></p>
                </div>
            </form>
        </section>

        <section class="random-section">
            <h2>Was schauen wir heute?</h2>
            <button type="button" id="random-button" class="random-button">Zufälligen Titel wählen</button>
            <p id="random-result" class="random-result">Klicke auf den Button, um überrascht zu werden.</p>
        </section>

        <section class="stats-section">
            <h2>Statistik</h2>
            <div class="stats">
                <div class="stat-card">
                    <span id="stat-total" class="stat-value">0</span>
                    <span class="stat-label">Titel gesamt</span>
                </div>
                <div class="stat-card">
                    <span id="stat-movies" class="stat-value">0</span>
                    <span class="stat-label">Filme</span>
                </div>
                <div class="stat-card">
                    <span id="stat-series" class="stat-value">0</span>
                    <span class="stat-label">Serien</span>
                </div>
                <div class="stat-card">
                    <span id="stat-watched" class="stat-value">0</span>
                    <span class="stat-label">Geschaut</span>
                </div>
                <div class="stat-card">
                    <span id="stat-average" class="stat-value">–</span>
                    <span class="stat-label">Ø Bewertung</span>
                </div>
            </div>
        </section>

        <section class="watchlist-section">
            <h2>Eure Watchlist</h2>

            <div class="toolbar">
                <div class="toolbar-field">
                    <label for="search-input">Suche nach Titel</label>
                    <input type="search" id="search-input" placeholder="Titel suchen…">
                </div>

                <div class="toolbar-field">
                    <label for="filter-type">Typ</label>
                    <select id="filter-type">
                        <option value="alle">Alle</option>
                        <option value="Film">Film</option>
                        <option value="Serie">Serie</option>
                    </select>
                </div>

                <div class="toolbar-field">
                    <label for="filter-status">Status</label>
                    <select id="filter-status">
                        <option value="alle">Alle</option>
                        <option value="geschaut">Geschaut</option>
                        <option value="offen">Noch offen</option>
                    </select>
                </div>

                <div class="toolbar-field">
                    <label for="filter-genre">Genre</label>
                    <select id="filter-genre">
                        <option value="alle">Alle</option>
                    </select>
                </div>

                <div class="toolbar-field">
                    <label for="sort-select">Sortieren nach</label>
                    <select id="sort-select">
                        <option value="title-asc">Titel (A–Z)</option>
                        <option value="title-desc">Titel (Z–A)</option>
                        <option value="rating-desc">Bewertung (beste zuerst)</option>
                        <option value="rating-asc">Bewertung (schlechteste zuerst)</option>
                    </select>
                </div>
            </div>

            <ul id="movie-list" class="movie-grid">
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Rotten Potato – WI_25B_Gruppe_1</p>
    </footer>
</body>
</html>
