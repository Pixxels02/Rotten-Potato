<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotten Potato - Watchlist Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/storage.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Rotten Potato</h1>
        <p class="site-slogan">Eure Watchlist für Filme und Serien</p>
    </header>

    <main class="main-content">
        <section class="add-section">
            <h2>Neuen Titel hinzufügen</h2>
        </section>

        <section class="random-section">
            <h2>Was schauen wir heute?</h2>
            <button type="button" id="random-button" class="random-button">Zufälligen Titel wählen</button>
            <p id="random-result" class="random-result">Klicke auf den Button, um überrascht zu werden.</p>
        </section>

        <section class="watchlist-section">
            <h2>Eure Watchlist</h2>
            <ul id="movie-list" class="movie-grid">
            </ul>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Rotten Potato – WI_25B_Gruppe_1</p>
    </footer>
</body>
</html>
